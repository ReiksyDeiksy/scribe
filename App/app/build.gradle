plugins { id 'com.android.application' }

def localSigningFile = rootProject.file('.tools/signing/config.json')
def localSigning = localSigningFile.exists() ? new groovy.json.JsonSlurper().parse(localSigningFile) : null

android {
    namespace 'ro.scribe.lectures'
    compileSdk 35
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'ro.scribe.lectures'
        minSdk 31
        targetSdk 35
        versionCode 7
        versionName '0.2.0-test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (localSigning != null) {
            persistentTest {
                storeFile file(localSigning.storeFile)
                storePassword localSigning.password
                keyAlias localSigning.alias
                keyPassword localSigning.password
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix ''; debuggable true }
        release { minifyEnabled false }
    }
    if (localSigning != null) {
        buildTypes.debug.signingConfig signingConfigs.persistentTest
        buildTypes.release.signingConfig signingConfigs.persistentTest
    }
    androidResources { noCompress 'bin', 'onnx' }
    sourceSets.main.jniLibs.srcDirs = [rootProject.file('.tools/lecture-runtime/jniLibs')]
    bundle { language { enableSplit = false } }
    packaging { jniLibs {
        useLegacyPackaging = false
        keepDebugSymbols += ['**/libsherpa-onnx-c-api.so', '**/libonnxruntime.so']
    } }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
